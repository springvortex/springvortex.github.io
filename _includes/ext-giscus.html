<section class="post-comments" aria-labelledby="post-comments">
  <h2 id="post-comments">评论</h2>
  <div class="giscus-container" id="giscus-container"></div>
</section>

<script>
;(function () {
  const giscusThemeBase = '{{ site.domainUrl | append: site.baseurl | append: "/static/css/giscus-" | escape }}'
  const container = document.getElementById('giscus-container')
  if (!container || container.querySelector('iframe.giscus-frame')) {
    return
  }

  let loaded = false

  function themeUrl(dark) {
    return giscusThemeBase + (dark ? 'dark' : 'light') + '.css?t=' + window.blog.buildAt
  }

  function loadGiscus() {
    if (loaded) {
      return
    }
    loaded = true

    const script = document.createElement('script')
    script.src = 'https://giscus.app/client.js'
    script.async = true
    script.crossOrigin = 'anonymous'
    script.dataset.repo = '{{ site.giscus.repo | escape }}'
    script.dataset.repoId = '{{ site.giscus.repoId | escape }}'
    script.dataset.category = '{{ site.giscus.category | escape }}'
    script.dataset.categoryId = '{{ site.giscus.categoryId | escape }}'
    script.dataset.mapping = 'pathname'
    script.dataset.strict = '1'
    script.dataset.reactionsEnabled = '{{ site.giscus.reactionsEnabled | default: true }}'
    script.dataset.emitMetadata = '0'
    script.dataset.inputPosition = 'top'
    script.dataset.theme = themeUrl(window.blog && window.blog.darkTheme)
    script.dataset.lang = 'zh-CN'
    script.dataset.loading = 'lazy'
    container.appendChild(script)
  }

  function syncGiscusTheme(dark) {
    const frame = container.querySelector('iframe.giscus-frame')
    if (!frame) {
      return
    }

    frame.contentWindow.postMessage({
      giscus: {
        setConfig: {
          theme: themeUrl(dark)
        }
      }
    }, 'https://giscus.app')
  }

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(function (entries, observer) {
      if (entries.some(function (entry) { return entry.isIntersecting })) {
        observer.disconnect()
        loadGiscus()
      }
    }, { rootMargin: '280px 0px' })
    observer.observe(container)
  } else {
    window.blog.addLoadEvent(loadGiscus)
  }

  const setDarkTheme = window.blog.setDarkTheme
  window.blog.setDarkTheme = function (dark) {
    setDarkTheme.call(window.blog, dark)
    syncGiscusTheme(dark)
  }
})()
</script>
