<header class="header">
  <a class="brand" href="{{ site.baseurl }}/">
    <img class="logo" src="{{ site.baseurl }}/static/img/logo.webp"
      width="38" height="38" alt="SpringVortex Notes" fetchpriority="high" decoding="async" />
    <span class="brand-name">SpringVortex<span>Notes</span></span>
  </a>
  <nav class="menu" aria-label="主导航">
    {%- for menu in site.menu -%}
    {%- assign href = menu.url -%}
    {%- unless href contains "://" -%}
    {%- assign href = site.baseurl | append: menu.url -%}
    {%- endunless -%}
    <a href="{{ href }}"{% if menu.target == '_blank' %} target="_blank" rel="noopener noreferrer"{% endif %} class="hover-underline">{{ menu.title }}</a>
    {%- endfor -%}
  </nav>
</header>
