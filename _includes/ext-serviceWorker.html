<script>
  ;(function () {
    const extServiceWorker = '{{ site.extServiceWorker }}' === 'true'
    if (!extServiceWorker) return
    if (!navigator.serviceWorker) return
    if (location.protocol !== 'https:' && location.hostname !== '127.0.0.1') return
    let refreshing = false
    window.addEventListener('load', function () {
      navigator.serviceWorker
        .register(blog.baseurl + '/service-worker.js', { updateViaCache: 'none' })
        .catch(function (e) {
          console.error('serviceWorker register fail', e)
        })
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing) return
        refreshing = true
        window.location.reload()
      })
    })
  })()
</script>
