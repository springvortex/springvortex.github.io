---
layout: page
title: Search
search: true
---

<main class="page page-search">
  <label class="visually-hidden" for="search-input">Search posts</label>
  <input id="search-input" type="search" placeholder="Enter keywords here">
  <h1>
    <span>Search Results</span>
    <img src="{{site.baseurl}}/static/img/loading.svg" width="21" height="21" alt="" loading="lazy" decoding="async">
  </h1>
  <p id="search-status" class="search-status" hidden></p>
  <ul class="list-search">
    {%- for post in site.posts  %}
    <li hidden>
      <a href="{{site.baseurl}}{{ post.url }}">
        <p class="title">{{ post.title }}</p>
        <p class="content"></p>
      </a>
    </li>
    {%- endfor %}
  </ul>
</main>
