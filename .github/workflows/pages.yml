name: Build and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build Jekyll site
        run: |
          bundle install
          JEKYLL_ENV=production bundle exec jekyll build --destination _site
          npm ci
          POPULAR_COUNTER_ENDPOINT=https://abacus.jasoncameron.dev \
          POPULAR_COUNTER_NAMESPACE=uhaiin.com \
          npm run popular -- _site
          npm run minify -- _site

      - name: Check generated site
        run: npm run check -- _site

      - name: Audit npm dependencies
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
