# 点击页面文字冒出特效,不需要请设置为false
extClickEffect: false
# 数学公式支持，比较影响加载速度,不需要请设置为false
extMath: true
# Mermaid图表渲染，不需要请设置为false
extMermaid: true
# 文章二维码，不需要请设置为false
extQrCode: true
# 文章评论，基于 GitHub Discussions；categoryId 为空时不输出评论区
extGiscus: true
# 页面右下角主题切换按钮，不需要请设置为false
extThemeToggle: true
# PWA离线缓存，不需要请设置为false
extServiceWorker: true
# 文章打开次数与首页热门文章；Abacus 兼容接口可替换为自己的计数服务
