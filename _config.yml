# 这些不要动
permalink: /posts/:year/:month/:day/:title
kramdown:
  auto_ids: true
  input: GFM
  syntax_highlighter: rouge
exclude: ['CNAME', 'README.md', 'LICENSE', '_site', 'dist', 'source-assets', 'Gemfile', 'Gemfile.lock', 'blog.sh', 'package.json', 'package-lock.json', 'scripts', 'node_modules']

url: 'https://uhaiin.com'
domainUrl: 'https://uhaiin.com'
baseurl: ''

# 搜索平台站点验证码；留空时不输出验证标签
